[tool]
id = "com.jmsbrain.mailcal.light"
label = "Mailcal Light"
versionCode = 3
versionName = "1.1.0"
# CalDAV and .ics feeds only.
permissions = ["android.permission.INTERNET"]
# To test against tools/MockCalDav.java (plain http), temporarily use:
# capabilities = ["cleartext-http"]
capabilities = []
orientation = "portrait"
# for the LightOS emulator, use the line below and build with -DlightSdk.allowAltServerPackage=true
# serverPackage = "com.thelightphone.sdk.emulator"
serverPackage = "com.lightos"
